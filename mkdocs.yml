site_name: ERDR — Enemy-Radius Density Reduction
site_description: The ERDR algorithm — training / validation split by enemy radii and local density
site_url: https://ktuhtabayev.github.io/erdr/
repo_url: https://github.com/ktuhtabayev/erdr
repo_name: ktuhtabayev/erdr
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - The algorithm: algorithm.md
  - Visualizations: visualizations.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Datasets: datasets.md
  - Command line: cli.md
  - Desktop application: gui.md
  - Validation: validation.md
  - Exporting: exporting.md
  - Extending: extending.md
  - Decisions: DECISIONS.md
  - Development: development.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
