# erdr experiment configuration (Enemy-Radius Density Reduction)
# preset: closest
# ⚠ reading B (not the literal article text): processed objects stop covering (B = 2)
# ⚠ reading z (not the literal article text): z(Sᵢ, k) is taken over the own class only

schema_version: 1
name: erdr-heart-disease-270-closest
description: All 270 objects, the reading closest to the article's Table 1 (|D| =
  75 for k = 3).
dataset:
  path: heart-disease-270
  format: auto
  sheet: null
  class_column: null
  id_column: null
  feature_types: null
  missing_values: error
preprocessing:
  normalizer:
    name: minmax
    params: {}
distance:
  metric:
    name: auto
    params: {}
  type_metrics:
    quantitative:
      name: manhattan
      params: {}
    nominal:
      name: hamming
      params: {}
    heterogeneous:
      name: zhuravlev
      params: {}
  features: auto
  decimals: 10
erdr:
  k: 3
  k_rule: enforce
  epsilon: 0.001
  d_decimals: 10
  readings:
    self_in_l: included
    blocked_cover: dropped
    step5_return: after-all
    z_scope: own-class
output:
  runs_dir: runs
  dataset_formats:
  - dat
  - csv
