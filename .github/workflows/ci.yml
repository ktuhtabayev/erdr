name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint and type-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov --cov-report=term-missing --cov-report=xml
      # the package against every computed sheet of the ERDR workbook (ADR-001)
      - run: erdr validate
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  docs:
    name: Docs build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[docs]"
      - run: mkdocs build --strict
      # the site is published from main only (job "pages")
      - uses: actions/configure-pages@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

  pages:
    name: Publish the documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: windows-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  executable:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[gui,release]"
      # freezes the desktop application, runs its self-test and packs it (ADR-013)
      - run: python scripts/build_exe.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: erdr-gui-windows
          path: |
            dist/erdr-gui-*-windows.zip
            dist/self-test.txt
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, tests, docs, executable]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: erdr-gui-windows
          path: dist
      # the executable of exactly the tagged commit, with the CHANGELOG entry as the notes
      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $notes = (Get-Content CHANGELOG.md -Raw) -split "(?m)^## " |
            Where-Object { $_ -like "[$version]*" } | Select-Object -First 1
          if (-not $notes) { $notes = "Release $tag" } else { $notes = "## " + $notes }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release create $tag (Get-ChildItem dist/erdr-gui-*-windows.zip) `
            --title "ERDR $version" --notes-file release-notes.md
