[project]
name = "erdr"
version = "0.1.0"
description = "Enemy-Radius Density Reduction (ERDR): training / validation split by enemy radii and local density — library, CLI and desktop GUI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Kudratillo Tuhtabayev", email = "ktuhtabayev@gmail.com" }
]
keywords = [
  "pattern recognition",
  "training sample selection",
  "instance selection",
  "ERDR",
  "Zhuravlev metric",
  "k nearest neighbours",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "tomli-w>=1.0",
  "typer>=0.12",
]

[project.optional-dependencies]
# Desktop application (ADR-012)
gui = ["PySide6-Essentials>=6.7"]
# Portable Windows executable of the desktop application (ADR-013)
release = ["pyinstaller>=6.6"]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.11",
  "pre-commit>=3.7",
  "PySide6-Essentials>=6.7",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-qt>=4.4",
  "ruff>=0.6",
  "types-openpyxl>=3.1",
  "types-PyYAML>=6.0",
]
docs = [
  # MkDocs 2.0 drops the plugin/theme system Material depends on
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
]

[project.scripts]
erdr = "erdr.cli.app:main"

[project.gui-scripts]
erdr-gui = "erdr.gui.app:main"

[project.urls]
Repository = "https://github.com/ktuhtabayev/erdr"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
erdr = ["py.typed", "data/datasets/*.csv"]

# ---------------------------------------------------------------- tests
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
  "error",
  # matplotlib's Qt toolbar reads a Qt attribute that PySide6 marks as deprecated
  "ignore:Enum value .*AA_UseHighDpiPixmaps. is marked as deprecated:DeprecationWarning",
]
qt_api = "pyside6"
markers = [
  "golden: acceptance tests against the ERDR workbook and the step-by-step guide",
  "slow: long-running tests (all 270 objects, k sweeps)",
  "gui: tests that need a Qt application",
]

[tool.coverage.run]
source = ["erdr"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------- lint / format
[tool.ruff]
line-length = 100
target-version = "py311"
# Protected source material: never reformatted or linted (CLAUDE.md)
extend-exclude = ["resources"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E", "W", "F",  # pycodestyle, pyflakes
  "I",            # import order
  "B",            # bugbear
  "UP",           # pyupgrade
  "SIM",          # simplify
  "C4",           # comprehensions
  "PIE", "RET", "ISC",
  "PTH",          # pathlib
  "N",            # naming
  "D",            # docstrings (every public function names its article step)
  "NPY",          # numpy
  "PT",           # pytest style
  "T20",          # no print() in the library
  "RUF",
]
ignore = [
  # The article's notation is kept in docstrings and messages (ρ, ε, ∅, ×, −, …)
  "RUF001", "RUF002", "RUF003",
  # Mathematical names follow the article (X, D, F, L, …)
  "N803", "N806",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "N802"]
"scripts/**" = ["T20"]
# Qt names its methods and signals in camelCase (rowCount, datasetChanged)
"src/erdr/gui/**" = ["N802", "N815"]

# ---------------------------------------------------------------- types
[tool.mypy]
# numpy ≥ 2.5 ships stubs with PEP 695 `type` statements (Python 3.12 syntax); ruff's py311
# target and the Python 3.11 test job keep the code itself 3.11-compatible.
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
